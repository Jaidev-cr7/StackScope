# The nginx configuration for the frontend image.
#
# It does two jobs: serve the built bundle, and forward the API to the
# backend. Everything the browser talks to is on one origin, so the session
# cookie stays first-party and no CORS preflight is involved.

upstream ci_investigator_backend {
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The upload and the log bodies are small, but the JSON body limit in the
    # application is 256 KB, so nginx must not be stricter than the app.
    client_max_body_size 1m;

    # Hiding the version costs nothing and tells an attacker less.
    server_tokens off;

    # The application sets its own security headers through helmet. These two
    # are about the static files, which never reach the application.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets never change under the same name, so they can be cached
    # forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API, and the event stream. The stream needs buffering off, or nginx
    # holds the frames back and the UI stops updating live.
    location /api/ {
        proxy_pass http://ci_investigator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended to.
        #
        # The application uses this header to work out the client's address,
        # and every rate limit is keyed on that address. $proxy_add_x_forwarded_for
        # appends to whatever the client sent, which means the client decides
        # part of the value the application believes. $remote_addr is the
        # address nginx itself saw, so the client cannot forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The single-page application: every unknown path is served by the app's
    # own router, not by a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
